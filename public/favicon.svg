      <circle cx="0" cy="0" r="58" fill="#0F172A"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 3"/>
      
      <!-- Minerva Bust Silhouette in White -->
      <!-- Helmet Crest -->
      <path d="M-12 -28 C-6 -42 16 -38 20 -24 C22 -15 14 -10 10 -6 L-10 -6 Z" fill="#FFFFFF"/>
      <!-- Face profile -->
      <path d="M-2 -8 L12 -8 L8 4 L14 4 L6 16 L2 22 L-8 22 L-10 12 L-6 4 Z" fill="#FFFFFF"/>
      <!-- Helmet Feathers / Crest Arc -->
      <path d="M-18 -22 C-14 -35 2 -40 16 -34 C12 -30 2 -26 -4 -20 Z" fill="#F0582C"/>
    </g>
  </g>
